<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genville - Simulation 3D de Ville Vivante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            overflow: hidden;
            color: #fff;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid #00ffff;
            backdrop-filter: blur(15px);
            max-width: 350px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.3);
        }
        
        #info-panel h1 {
            font-size: 32px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00ffff, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            font-weight: bold;
        }
        
        #info-panel p {
            font-size: 14px;
            margin-bottom: 10px;
            color: #ddd;
            line-height: 1.6;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            margin: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .control-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        #stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #ff00ff;
            backdrop-filter: blur(15px);
            font-family: 'Courier New', monospace;
            box-shadow: 0 8px 32px rgba(255, 0, 255, 0.3);
        }
        
        .stat-line {
            color: #ff00ff;
            margin: 8px 0;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        
        .stat-value {
            color: #00ffff;
            font-weight: bold;
        }
        
        #time-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 30px;
            border-radius: 15px;
            border: 3px solid #ffaa00;
            backdrop-filter: blur(15px);
            font-size: 24px;
            color: #ffaa00;
            text-shadow: 0 0 15px #ffaa00;
            box-shadow: 0 8px 32px rgba(255, 170, 0, 0.3);
            font-weight: bold;
        }
        
        #weather-display {
            position: absolute;
            top: 100px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 15px;
            border: 3px solid #00ff88;
            backdrop-filter: blur(15px);
            font-size: 18px;
            color: #00ff88;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.3);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05); }
        }
        
        .subtitle {
            font-style: italic;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info-panel">
        <h1>🌆 Genville</h1>
        <p class="subtitle">Simulation 3D de ville vivante</p>
        <p><strong>Contrôles:</strong></p>
        <p>🖱️ Clic gauche + glisser : Rotation</p>
        <p>🖱️ Molette : Zoom</p>
        <p>🖱️ Clic droit + glisser : Déplacer</p>
        <div style="margin-top: 15px;">
            <button class="control-btn" onclick="regenerateCity()">🔄 Nouvelle Ville</button>
            <button class="control-btn" onclick="toggleAnimation()">⏯️ Pause/Play</button>
            <button class="control-btn" onclick="toggleDayNight()">🌗 Cycle Jour/Nuit</button>
            <button class="control-btn" onclick="changeWeather()">🌦️ Météo</button>
        </div>
    </div>
    
    <div id="time-display">🌅 <span id="time-text">06:00</span></div>
    
    <div id="weather-display">☀️ <span id="weather-text">Ensoleillé</span></div>
    
    <div id="stats">
        <div class="stat-line">🏢 Bâtiments: <span class="stat-value" id="building-count">0</span></div>
        <div class="stat-line">🌳 Arbres: <span class="stat-value" id="tree-count">0</span></div>
        <div class="stat-line">🚶 Habitants: <span class="stat-value" id="villager-count">0</span></div>
        <div class="stat-line">🚗 Véhicules: <span class="stat-value" id="car-count">0</span></div>
        <div class="stat-line">📊 FPS: <span class="stat-value" id="fps-count">60</span></div>
    </div>
    
    <div id="loading">⏳ Génération de Genville...</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuration globale
        let scene, camera, renderer, controls;
        let buildings = [], trees = [], villagers = [], cars = [];
        let roads = [];
        let animationRunning = true;
        let dayNightCycle = true;
        let timeOfDay = 0;
        let weatherState = 'sunny'; // sunny, cloudy, rainy
        let rainParticles = [];
        
        // Initialisation
        function init() {
            // Scène
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87ceeb, 50, 200);
            
            // Caméra
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(50, 60, 50);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Contrôles orbitaux basiques
            setupControls();
            
            // Lumières
            setupLights();
            
            // Sol
            createGround();
            
            // Génération de la ville
            generateCity();
            
            // Gestion de redimensionnement
            window.addEventListener('resize', onWindowResize);
            
            // Cacher le loading
            document.getElementById('loading').style.display = 'none';
            
            // Démarrer l'animation
            animate();
        }
        
        function setupLights() {
            // Lumière ambiante
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            // Soleil (lumière directionnelle)
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -100;
            sunLight.shadow.camera.right = 100;
            sunLight.shadow.camera.top = 100;
            sunLight.shadow.camera.bottom = -100;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);
            scene.userData.sunLight = sunLight;
            scene.userData.ambientLight = ambientLight;
        }
        
        function createGround() {
            // Herbe
            const groundGeometry = new THREE.PlaneGeometry(200, 200);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x2d5016 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }
        
        function generateCity() {
            // Nettoyer l'ancienne ville
            clearCity();
            
            const citySize = 80;
            const blockSize = 20;
            const roadWidth = 4;
            
            // Générer les routes (grille)
            for (let x = -citySize; x <= citySize; x += blockSize) {
                createRoad(x, -citySize, x, citySize, roadWidth);
            }
            for (let z = -citySize; z <= citySize; z += blockSize) {
                createRoad(-citySize, z, citySize, z, roadWidth);
            }
            
            // Générer les bâtiments et arbres
            for (let x = -citySize + blockSize/2; x < citySize; x += blockSize) {
                for (let z = -citySize + blockSize/2; z < citySize; z += blockSize) {
                    if (Math.random() > 0.3) {
                        createBuilding(x, z);
                    } else {
                        // Parc avec arbres
                        for (let i = 0; i < 5; i++) {
                            const offsetX = (Math.random() - 0.5) * 10;
                            const offsetZ = (Math.random() - 0.5) * 10;
                            createTree(x + offsetX, z + offsetZ);
                        }
                    }
                }
            }
            
            // Créer les villageois
            for (let i = 0; i < 50; i++) {
                createVillager();
            }
            
            // Créer les voitures
            for (let i = 0; i < 20; i++) {
                createCar();
            }
            
            updateStats();
        }
        
        function clearCity() {
            buildings.forEach(b => scene.remove(b));
            trees.forEach(t => scene.remove(t));
            villagers.forEach(v => scene.remove(v.mesh));
            cars.forEach(c => scene.remove(c.mesh));
            roads.forEach(r => scene.remove(r));
            
            buildings = [];
            trees = [];
            villagers = [];
            cars = [];
            roads = [];
        }
        
        function createRoad(x1, z1, x2, z2, width) {
            const length = Math.sqrt((x2-x1)**2 + (z2-z1)**2);
            const geometry = new THREE.PlaneGeometry(width, length);
            const material = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(geometry, material);
            
            road.position.set((x1+x2)/2, 0.1, (z1+z2)/2);
            road.rotation.x = -Math.PI / 2;
            if (x1 === x2) road.rotation.z = Math.PI / 2;
            road.receiveShadow = true;
            
            scene.add(road);
            roads.push(road);
        }
        
        function createBuilding(x, z) {
            const width = 5 + Math.random() * 5;
            const height = 10 + Math.random() * 30;
            const depth = 5 + Math.random() * 5;
            
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const color = new THREE.Color();
            color.setHSL(Math.random(), 0.5, 0.5 + Math.random() * 0.2);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const building = new THREE.Mesh(geometry, material);
            
            building.position.set(x, height/2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            
            // Fenêtres
            const windowGeometry = new THREE.PlaneGeometry(0.5, 0.5);
            const windowMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffff00,
                emissive: 0xffff00,
                emissiveIntensity: 0.5
            });
            
            for (let i = 0; i < Math.floor(height / 3); i++) {
                for (let j = 0; j < Math.floor(width / 2); j++) {
                    if (Math.random() > 0.3) {
                        const window = new THREE.Mesh(windowGeometry, windowMaterial);
                        window.position.set(
                            -width/2 + 0.1,
                            -height/2 + 2 + i * 3,
                            -depth/2 + 1 + j * 2
                        );
                        window.rotation.y = Math.PI / 2;
                        building.add(window);
                    }
                }
            }
            
            scene.add(building);
            buildings.push(building);
        }
        
        function createTree(x, z) {
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.4, 3, 8);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.set(x, 1.5, z);
            trunk.castShadow = true;
            
            const leavesGeometry = new THREE.SphereGeometry(2, 8, 8);
            const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.set(x, 4, z);
            leaves.castShadow = true;
            
            scene.add(trunk);
            scene.add(leaves);
            trees.push(trunk);
            trees.push(leaves);
        }
        
        function createVillager() {
            const geometry = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8);
            const color = new THREE.Color();
            color.setHSL(Math.random(), 0.8, 0.6);
            const material = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            
            const x = (Math.random() - 0.5) * 150;
            const z = (Math.random() - 0.5) * 150;
            mesh.position.set(x, 0.75, z);
            mesh.castShadow = true;
            
            const villager = {
                mesh: mesh,
                speed: 0.02 + Math.random() * 0.03,
                direction: Math.random() * Math.PI * 2,
                changeTime: Math.random() * 300
            };
            
            scene.add(mesh);
            villagers.push(villager);
        }
        
        function createCar() {
            const bodyGeometry = new THREE.BoxGeometry(2, 1, 4);
            const color = new THREE.Color();
            color.setHSL(Math.random(), 1, 0.5);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            
            const roofGeometry = new THREE.BoxGeometry(1.5, 0.8, 2);
            const roof = new THREE.Mesh(roofGeometry, bodyMaterial);
            roof.position.y = 0.9;
            roof.position.z = -0.5;
            body.add(roof);
            
            const x = (Math.random() - 0.5) * 150;
            const z = (Math.random() - 0.5) * 150;
            body.position.set(x, 0.5, z);
            
            const car = {
                mesh: body,
                speed: 0.1 + Math.random() * 0.1,
                direction: Math.floor(Math.random() * 4) * Math.PI / 2,
                onRoad: true
            };
            
            body.rotation.y = car.direction;
            scene.add(body);
            cars.push(car);
        }
        
        function updateVillagers() {
            villagers.forEach(v => {
                v.changeTime--;
                if (v.changeTime <= 0) {
                    v.direction = Math.random() * Math.PI * 2;
                    v.changeTime = 100 + Math.random() * 200;
                }
                
                const dx = Math.cos(v.direction) * v.speed;
                const dz = Math.sin(v.direction) * v.speed;
                
                v.mesh.position.x += dx;
                v.mesh.position.z += dz;
                v.mesh.rotation.y = v.direction;
                
                // Limites
                if (Math.abs(v.mesh.position.x) > 75) v.direction = Math.PI - v.direction;
                if (Math.abs(v.mesh.position.z) > 75) v.direction = -v.direction;
            });
        }
        
        function updateCars() {
            cars.forEach(c => {
                const dx = Math.cos(c.direction) * c.speed;
                const dz = Math.sin(c.direction) * c.speed;
                
                c.mesh.position.x += dx;
                c.mesh.position.z += dz;
                
                // Limites et demi-tour
                if (Math.abs(c.mesh.position.x) > 75 || Math.abs(c.mesh.position.z) > 75) {
                    c.direction += Math.PI;
                    c.mesh.rotation.y = c.direction;
                }
            });
        }
        
        function updateDayNightCycle() {
            if (!dayNightCycle) return;
            
            timeOfDay += 0.001;
            if (timeOfDay > 1) timeOfDay = 0;
            
            const hour = Math.floor(timeOfDay * 24);
            const minute = Math.floor((timeOfDay * 24 * 60) % 60);
            document.getElementById('time-text').textContent = 
                `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            
            // Couleur du ciel
            const skyColor = new THREE.Color();
            if (timeOfDay < 0.25) { // Nuit
                skyColor.setRGB(0.02, 0.02, 0.1);
                scene.userData.sunLight.intensity = 0.2;
                scene.userData.ambientLight.intensity = 0.1;
            } else if (timeOfDay < 0.35) { // Aube
                skyColor.setRGB(0.5, 0.3, 0.4);
                scene.userData.sunLight.intensity = 0.5;
                scene.userData.ambientLight.intensity = 0.3;
            } else if (timeOfDay < 0.75) { // Jour
                skyColor.setRGB(0.53, 0.81, 0.92);
                scene.userData.sunLight.intensity = 1.0;
                scene.userData.ambientLight.intensity = 0.6;
            } else { // Crépuscule
                skyColor.setRGB(0.8, 0.4, 0.2);
                scene.userData.sunLight.intensity = 0.5;
                scene.userData.ambientLight.intensity = 0.3;
            }
            
            scene.background = skyColor;
            scene.fog.color = skyColor;
            
            // Position du soleil
            const sunAngle = timeOfDay * Math.PI * 2;
            scene.userData.sunLight.position.set(
                Math.cos(sunAngle) * 100,
                Math.sin(sunAngle) * 100,
                50
            );
            
            // Icône de temps
            let timeIcon = '🌅';
            if (timeOfDay < 0.25) timeIcon = '🌙';
            else if (timeOfDay < 0.35) timeIcon = '🌅';
            else if (timeOfDay < 0.75) timeIcon = '☀️';
            else timeIcon = '🌇';
            
            document.getElementById('time-display').innerHTML = 
                `${timeIcon} <span id="time-text">${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}</span>`;
        }
        
        function updateWeather() {
            if (weatherState === 'rainy') {
                // Créer des gouttes de pluie
                if (rainParticles.length < 1000 && Math.random() > 0.5) {
                    const dropGeometry = new THREE.SphereGeometry(0.1, 4, 4);
                    const dropMaterial = new THREE.MeshBasicMaterial({ color: 0x4444ff, transparent: true, opacity: 0.6 });
                    const drop = new THREE.Mesh(dropGeometry, dropMaterial);
                    drop.position.set(
                        (Math.random() - 0.5) * 200,
                        50 + Math.random() * 50,
                        (Math.random() - 0.5) * 200
                    );
                    scene.add(drop);
                    rainParticles.push(drop);
                }
                
                // Animer la pluie
                rainParticles.forEach((drop, index) => {
                    drop.position.y -= 0.5;
                    if (drop.position.y < 0) {
                        scene.remove(drop);
                        rainParticles.splice(index, 1);
                    }
                });
            }
        }
        
        function changeWeather() {
            const weathers = ['sunny', 'cloudy', 'rainy'];
            const currentIndex = weathers.indexOf(weatherState);
            weatherState = weathers[(currentIndex + 1) % weathers.length];
            
            const weatherIcons = { sunny: '☀️', cloudy: '☁️', rainy: '🌧️' };
            const weatherNames = { sunny: 'Ensoleillé', cloudy: 'Nuageux', rainy: 'Pluvieux' };
            
            document.getElementById('weather-display').innerHTML = 
                `${weatherIcons[weatherState]} <span id="weather-text">${weatherNames[weatherState]}</span>`;
            
            if (weatherState !== 'rainy') {
                // Nettoyer la pluie
                rainParticles.forEach(drop => scene.remove(drop));
                rainParticles = [];
            }
        }
        
        function setupControls() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let cameraRotation = { x: 0, y: 0 };
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                cameraRotation.y += deltaX * 0.005;
                cameraRotation.x += deltaY * 0.005;
                cameraRotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, cameraRotation.x));
                
                const radius = 80;
                camera.position.x = radius * Math.cos(cameraRotation.y) * Math.cos(cameraRotation.x);
                camera.position.z = radius * Math.sin(cameraRotation.y) * Math.cos(cameraRotation.x);
                camera.position.y = 60 + radius * Math.sin(cameraRotation.x);
                camera.lookAt(0, 0, 0);
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.1;
                const delta = e.deltaY * zoomSpeed;
                
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                camera.position.addScaledVector(direction, -delta);
                
                const minDistance = 20;
                const maxDistance = 150;
                const distance = camera.position.length();
                if (distance < minDistance || distance > maxDistance) {
                    camera.position.addScaledVector(direction, delta);
                }
            });
        }
        
        function updateStats() {
            document.getElementById('building-count').textContent = buildings.length;
            document.getElementById('tree-count').textContent = Math.floor(trees.length / 2);
            document.getElementById('villager-count').textContent = villagers.length;
            document.getElementById('car-count').textContent = cars.length;
        }
        
        let lastTime = Date.now();
        let frameCount = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (animationRunning) {
                updateVillagers();
                updateCars();
                updateDayNightCycle();
                updateWeather();
            }
            
            // Calcul FPS
            frameCount++;
            const currentTime = Date.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps-count').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            renderer.render(scene, camera);
        }
        
        function regenerateCity() {
            generateCity();
        }
        
        function toggleAnimation() {
            animationRunning = !animationRunning;
        }
        
        function toggleDayNight() {
            dayNightCycle = !dayNightCycle;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Démarrer l'application
        init();
    </script>
</body>
</html>
