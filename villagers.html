<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genville Island</title>
<style>
*{margin:0;padding:0}
body{font-family:Arial;overflow:hidden;color:#fff}
#info{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.85);padding:20px;border-radius:15px;border:3px solid #0ff;z-index:100}
h1{color:#0ff;font-size:24px;margin-bottom:8px}
.btn{background:#667eea;border:0;color:#fff;padding:10px 18px;margin:5px;border-radius:8px;cursor:pointer;font-weight:bold}
#time{position:absolute;top:20px;right:20px;background:rgba(0,0,0,.85);padding:15px 25px;border-radius:15px;border:3px solid #fa0;font-size:22px;color:#fa0;font-weight:bold}
</style>
</head>
<body>
<div id="info"><h1>🏝️ GENVILLE ISLAND</h1><p>🌊 Ville sur une île</p><button class="btn" onclick="addVillager()">➕ Villageois</button></div>
<div id="time">00:00</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,villagers=[],ocean,t=0;
scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,80,250);
camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
camera.position.set(0,35,45);
camera.lookAt(0,0,0);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.6));
const sun=new THREE.DirectionalLight(0xffffaa,.9);
sun.position.set(50,60,50);
sun.castShadow=true;
scene.add(sun);
const og=new THREE.PlaneGeometry(300,300,50,50);
og.rotateX(-Math.PI/2);
ocean=new THREE.Mesh(og,new THREE.MeshStandardMaterial({color:0x0077be,transparent:true,opacity:.85,roughness:.3}));
ocean.position.y=-1;
scene.add(ocean);
const beach=new THREE.Mesh(new THREE.CylinderGeometry(31,35,2.5,32),new THREE.MeshStandardMaterial({color:0xe0c98a}));
beach.position.y=.5;
beach.receiveShadow=true;
scene.add(beach);
const island=new THREE.Mesh(new THREE.CylinderGeometry(26,30,3,32),new THREE.MeshStandardMaterial({color:0x3a8c3f}));
island.position.y=2;
island.receiveShadow=true;
scene.add(island);
const cols=[0xff6b6b,0x4ecdc4,0xffe66d,0xa29bfe,0xfd79a8,0x55efc4,0xe17055,0x74b9ff];
for(let i=0;i<8;i++){
const a=i/8*Math.PI*2,r=10+Math.random()*10;
const h=5+Math.random()*5;
const b=new THREE.Mesh(new THREE.BoxGeometry(4,h,4),new THREE.MeshStandardMaterial({color:cols[i]}));
b.position.set(Math.cos(a)*r,3.5+h/2,Math.sin(a)*r);
b.castShadow=true;
scene.add(b);}
function addVillager(){
const v=new THREE.Mesh(new THREE.SphereGeometry(.7,10,10),new THREE.MeshStandardMaterial({color:Math.random()*0xffffff}));
v.position.set((Math.random()-.5)*24,4.2,(Math.random()-.5)*24);
v.userData={a:Math.random()*6.28,s:.015+Math.random()*.03};
scene.add(v);
villagers.push(v);}
for(let i=0;i<5;i++)addVillager();
function animate(){
requestAnimationFrame(animate);
t+=.02;
const p=ocean.geometry.attributes.position;
for(let i=0;i<p.count;i++)p.setY(i,Math.sin(t*2+p.getX(i)*.3)*.5+Math.cos(t+p.getZ(i)*.3)*.5);
p.needsUpdate=true;
villagers.forEach(v=>{
v.userData.a+=(Math.random()-.5)*.15;
v.position.x+=Math.cos(v.userData.a)*v.userData.s;
v.position.z+=Math.sin(v.userData.a)*v.userData.s;
if(Math.hypot(v.position.x,v.position.z)>23)v.userData.a+=Math.PI;});
renderer.render(scene,camera);}
setInterval(()=>{
const m=Math.floor(t*10%60),h=Math.floor(t/6%24);
document.getElementById('time').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;},100);
animate();
</script>
</body>
</html>
