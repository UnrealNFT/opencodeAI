<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VillageBeat 3D</title>
<style>
*{margin:0;padding:0}body{font-family:Arial;overflow:hidden;color:#fff}
#info{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.9);padding:20px;border-radius:15px;border:3px solid #0ff;z-index:100;max-width:320px}
h1{color:#0ff;font-size:26px;margin-bottom:10px}p{margin:8px 0;font-size:14px}
label.file{display:inline-block;background:linear-gradient(135deg,#667eea,#764ba2);border:0;color:#fff;padding:12px 24px;margin:8px 5px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:15px}
label.file:hover{transform:scale(1.05)}input[type=file]{display:none}
#stats{margin-top:15px;font-size:13px;color:#0ff}
#bar{width:100%;height:6px;background:#333;margin-top:12px;border-radius:3px;overflow:hidden}
#fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:width .1s}
</style>
</head>
<body>
<div id="info">
<h1>🏝️ VillageBeat Pro</h1>
<p>🎵 Ta musique génère une ville 3D avec arbres & voitures 🌳🚗</p>
<label class="file">🎵 Importer Musique<input type="file" id="f" accept="audio/*"></label>
<div id="stats">Bâtiments: 0 | Arbres: 0 | Voitures: 0</div>
<div id="bar"><div id="fill"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,buildings=[],trees=[],cars=[],ocean,t=0,audio,audioCtx,analyser,dataArray,startTime,duration=0;
scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,300);
camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
camera.position.set(0,40,60);
camera.lookAt(0,5,0);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.7));
const sun=new THREE.DirectionalLight(0xffffdd,1);
sun.position.set(60,80,40);
sun.castShadow=true;
scene.add(sun);
const og=new THREE.PlaneGeometry(400,400,60,60);
og.rotateX(-Math.PI/2);
ocean=new THREE.Mesh(og,new THREE.MeshStandardMaterial({color:0x0077be,transparent:true,opacity:.8,roughness:.2}));
ocean.position.y=-2;
scene.add(ocean);
const beach=new THREE.Mesh(new THREE.CylinderGeometry(45,50,4,40),new THREE.MeshStandardMaterial({color:0xd4b896}));
beach.position.y=1;
beach.receiveShadow=true;
scene.add(beach);
const island=new THREE.Mesh(new THREE.CylinderGeometry(38,45,5,40),new THREE.MeshStandardMaterial({color:0x3a9d3f}));
island.position.y=3.5;
island.receiveShadow=true;
scene.add(island);
function addTree(){const a=Math.random()*Math.PI*2,r=12+Math.random()*22;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,5,8),new THREE.MeshStandardMaterial({color:0x654321}));trunk.position.set(Math.cos(a)*r,6.5,Math.sin(a)*r);trunk.castShadow=true;scene.add(trunk);const leaves=new THREE.Mesh(new THREE.SphereGeometry(2.5,12,12),new THREE.MeshStandardMaterial({color:0x228b22}));leaves.position.set(Math.cos(a)*r,10,Math.sin(a)*r);leaves.castShadow=true;scene.add(leaves);trees.push({trunk,leaves});}
function addCar(){const a=Math.random()*Math.PI*2,r=18+Math.random()*14;const body=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.2,1.5),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.8,.5),metalness:.6}));body.position.set(Math.cos(a)*r,5.2,Math.sin(a)*r);body.castShadow=true;scene.add(body);cars.push({body,angle:a,radius:r,speed:.008+Math.random()*.012});}
function addBuilding(bass,mid,high){const a=Math.random()*Math.PI*2,r=10+Math.random()*20;let tooClose=false;for(let b of buildings){const dx=Math.cos(a)*r-b.position.x,dz=Math.sin(a)*r-b.position.z;if(Math.sqrt(dx*dx+dz*dz)<6){tooClose=true;break;}}if(tooClose)return;const w=2.5+Math.random()*1.5,d=2.5+Math.random()*1.5,h=8+bass/12;const hue=180+Math.random()*60;const building=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(hue/360,.65,.5)}));building.position.set(Math.cos(a)*r,5+h/2,Math.sin(a)*r);building.castShadow=true;building.receiveShadow=true;scene.add(building);for(let i=0;i<Math.floor(h/2.8);i++){for(let j=-1;j<=1;j+=2){const win=new THREE.Mesh(new THREE.BoxGeometry(.35,.55,.08),new THREE.MeshStandardMaterial({color:0xffff88,emissive:0xffaa00,emissiveIntensity:.9}));win.position.set(Math.cos(a)*r+Math.cos(a+Math.PI/2)*j*w/3.5,6.5+i*2.8,Math.sin(a)*r+Math.sin(a+Math.PI/2)*j*w/3.5);scene.add(win);}}buildings.push(building);}
document.getElementById('f').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);if(audio){audio.pause();audio=null}audio=new Audio(url);audioCtx=new(window.AudioContext||window.webkitAudioContext)();const src=audioCtx.createMediaElementSource(audio);analyser=audioCtx.createAnalyser();analyser.fftSize=512;dataArray=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);analyser.connect(audioCtx.destination);audio.play();audio.addEventListener('loadedmetadata',()=>{duration=audio.duration;startTime=Date.now()});buildings=[];trees=[];cars=[];for(let i=0;i<15;i++)addTree();for(let i=0;i<8;i++)addCar();});
function animate(){requestAnimationFrame(animate);t+=.015;const p=ocean.geometry.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,Math.sin(t*2.5+p.getX(i)*.25)*.7+Math.cos(t*1.8+p.getZ(i)*.25)*.7);p.needsUpdate=true;if(analyser&&audio&&!audio.paused){analyser.getByteFrequencyData(dataArray);let bass=dataArray.slice(0,12).reduce((a,b)=>a+b,0)/12;let mid=dataArray.slice(12,48).reduce((a,b)=>a+b,0)/36;let high=dataArray.slice(48,80).reduce((a,b)=>a+b,0)/32;if(bass>200&&Math.random()>.75)addBuilding(bass,mid,high);if(Math.random()>.98)addTree();if(Math.random()>.985)addCar();let elapsed=(Date.now()-startTime)/1000;let progress=duration>0?elapsed/duration:0;document.getElementById('fill').style.width=(progress*100)+'%';document.getElementById('stats').textContent=`Bâtiments: ${buildings.length} | Arbres: ${trees.length} | Voitures: ${cars.length}`;}cars.forEach(c=>{c.angle+=c.speed;c.body.position.x=Math.cos(c.angle)*c.radius;c.body.position.z=Math.sin(c.angle)*c.radius;c.body.rotation.y=c.angle+Math.PI/2;});camera.position.x=Math.sin(t*.12)*75;camera.position.z=Math.cos(t*.12)*75;camera.position.y=35+Math.sin(t*.25)*8;camera.lookAt(0,5,0);renderer.render(scene,camera);}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
